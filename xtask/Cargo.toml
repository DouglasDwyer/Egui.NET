[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false

# Deliberately its own workspace root, separate from the main Egui.NET
# workspace. xtask's job is to *produce* egui-rs-patched/ before the main
# workspace's `[patch.crates-io]` entries can even be resolved, so it must
# be runnable without Cargo trying to resolve the main workspace first.
[workspace]

[[bin]]
name = "xtask"
path = "src/main.rs"
