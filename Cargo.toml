[workspace]
members = [
    "egui_net",
    "egui_net_bindgen",
    "egui_net_ffi",
    "serde-generate",
]
# egui-rs/ has its own [workspace]; excluding it stops Cargo from resolving
# its patched crates' workspace-inherited fields against this workspace.
exclude = [ "egui-rs" ]
default-members = [ "egui_net" ]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.8.1+0.35.0"

[profile.dev]
debug = "line-tables-only"

[profile.release]
codegen-units = 1
incremental = false
opt-level = 3
debug = false
debug-assertions = false
lto = "fat"

[workspace.dependencies]

# Internal dependencies
egui_net = { path = "egui_net" }
egui_net_bindgen = { path = "egui_net_bindgen" }
egui_net_ffi = { path = "egui_net_ffi" }
serde-generate = { path = "serde-generate", default-features = false, features = [ "csharp" ] }

# External dependencies
ahash = { version = "0.8", default-features = false }
bincode = { version = "2.0.1", default-features = false, features = [ "std", "serde" ] }
bitflags = { version = "2", default-features = false }
convert_case = { version = "0.11.0", default-features = false }
csbindgen = { version = "1.9.7", default-features = false }
egui = { version = "0.35.0", default-features = false }
egui_extras = { version = "0.35.0", default-features = false, features = [ "datepicker", "image", "serde", "svg", "svg_text", "syntect" ] }
image = { version = "0.25.9", default-features = false, features = [ "default-formats" ] }
jiff = { version = "0.2.29", default-features = false, features = [ "std", "tz-system" ] }
mimalloc = { version = "0.1.47", default-features = false }
rustdoc-types = { version = "0.61.0", default-features = false }
serde = { version = "1.0.228", default-features = false, features = [ "derive" ] }
serde_json = { version = "1.0.145", default-features = false, features = [ "std" ] }
serde-reflection = { version = "0.6.0", default-features = false }

[workspace.metadata.cross.target]
x86_64-pc-windows-msvc = { image = "i18nsite/x86_64-pc-windows-msvc-cross@sha256:35307f58ade2bc99c295a4f8b88d4cc43ad7617b4c7fc001beb7ee5851135810" }
aarch64-pc-windows-msvc = { image = "i18nsite/aarch64-pc-windows-msvc-cross@sha256:cf5dd0300c2a945cf117d5d55dbb0ea0c9e2fed1feb828065119d96591234f18" }
x86_64-apple-darwin = { image = "i18nsite/x86_64-apple-darwin-cross@sha256:8604955bd3fd7bd5e18f8ad00853101dc90c30c8aaea53130909da58f734c94a" }
aarch64-apple-darwin = { image = "i18nsite/aarch64-apple-darwin-cross@sha256:737bd24b8bc893de2bec133277e4f69c33db725ef02d13c8f1277fe92098ba0d" }

[patch.crates-io]
egui = { path = "egui-rs/crates/egui" }
egui_extras = { path = "egui-rs/crates/egui_extras" }