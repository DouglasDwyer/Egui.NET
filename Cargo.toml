[workspace]
members = [
    "egui_net",
    "egui_net_bindgen",
    "egui_net_ffi",
    "serde-generate",
]
# egui-rs/ has its own [workspace]; excluding it stops Cargo from resolving
# its patched crates' workspace-inherited fields against this workspace.
exclude = [ "egui-rs" ]
default-members = [ "egui_net" ]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.7.0+0.33.2"

[profile.release]
codegen-units = 1
incremental = false
opt-level = 3
debug = false
debug-assertions = false
lto = "fat"

[workspace.dependencies]

# Internal dependencies
egui_net = { path = "egui_net" }
egui_net_bindgen = { path = "egui_net_bindgen" }
egui_net_ffi = { path = "egui_net_ffi" }
serde-generate = { path = "serde-generate", default-features = false, features = [ "csharp" ] }

# External dependencies
bincode = { version = "1.3.3", default-features = false }
convert_case = { version = "0.10.0", default-features = false }
csbindgen = { version = "1.9.7", default-features = false }
egui = { version = "0.33.2", default-features = false }
egui_extras = { version = "0.33.2", default-features = false, features = [ "image", "svg", "svg_text" ] }
image = { version = "0.25.9", default-features = false, features = [ "default-formats" ] }
mimalloc = { version = "0.1.47", default-features = false }
rustdoc-types = { version = "0.56.0", default-features = false }
serde = { version = "1.0.228", default-features = false, features = [ "derive" ] }
serde_json = { version = "1.0.145", default-features = false, features = [ "std" ] }
serde-reflection = { version = "0.5.1", default-features = false }

[patch.crates-io]
egui = { path = "egui-rs/crates/egui" }
egui_extras = { path = "egui-rs/crates/egui_extras" }