[workspace]
members = [
    "egui_net",
    "egui_net_bindgen",
    "egui_net_ffi",
    "serde-generate",
]
# egui-rs/ has its own [workspace]; excluding it stops Cargo from resolving
# its patched crates' workspace-inherited fields against this workspace.
exclude = [ "egui-rs" ]
default-members = [ "egui_net" ]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.9.0+0.36.1"

[profile.dev]
debug = "line-tables-only"

[profile.release]
codegen-units = 1
incremental = false
opt-level = 3
debug = false
debug-assertions = false
lto = "fat"

[workspace.dependencies]

# Internal dependencies
egui_net = { path = "egui_net" }
egui_net_bindgen = { path = "egui_net_bindgen" }
egui_net_ffi = { path = "egui_net_ffi" }
serde-generate = { path = "serde-generate", default-features = false, features = [ "csharp" ] }

# External dependencies
ahash = { version = "0.8", default-features = false }
bincode = { version = "2.0.1", default-features = false, features = [ "serde", "std" ] }
bitflags = { version = "2", default-features = false }
convert_case = { version = "0.11.0", default-features = false }
csbindgen = { version = "1.9.7", default-features = false }
egui = { version = "0.36.1", default-features = false }
egui_extras = { version = "0.36.1", default-features = false, features = [ "datepicker", "image", "serde", "svg", "svg_text", "syntect" ] }
image = { version = "0.25.9", default-features = false, features = [ "default-formats" ] }
jiff = { version = "0.2.29", default-features = false, features = [ "std", "tz-system" ] }
mimalloc = { version = "0.1.52", default-features = false }
rustdoc-types = { version = "0.61.0", default-features = false }
serde = { version = "1.0.228", default-features = false, features = [ "derive" ] }
serde_json = { version = "1.0.145", default-features = false, features = [ "std" ] }
serde-reflection = { version = "0.6.0", default-features = false }

[workspace.metadata.cross.target.x86_64-pc-windows-msvc]
image = "aloismisery/x86_64-pc-windows-msvc-cross@sha256:ff3bc5cbf9ff817bc9f19c65eaee5014a1440e0ec8caeb3175e95e468d97d91f"

[workspace.metadata.cross.target.aarch64-pc-windows-msvc]
image = "aloismisery/aarch64-pc-windows-msvc-cross@sha256:dc6cc176991c3526630c27cb41f9f17d23edd95ff892f079fb7a4502be91d748"

[workspace.metadata.cross.target.x86_64-apple-darwin]
image = "i18nsite/x86_64-apple-darwin-cross@sha256:8604955bd3fd7bd5e18f8ad00853101dc90c30c8aaea53130909da58f734c94a"

[workspace.metadata.cross.target.aarch64-apple-darwin]
image = "aloismisery/aarch64-apple-darwin-cross@sha256:c82fb79111206da2a18cfd917fbd89f1c3e996e7aaf22fc78553cc57b3e12c68"

[patch.crates-io]
egui = { path = "egui-rs/crates/egui" }
egui_extras = { path = "egui-rs/crates/egui_extras" }
mimalloc = { git = "https://github.com/DouglasDwyer/mimalloc_rust", rev = "851088d4e2b02f0c7347fa9d5f898dcc6e75d8ed" }