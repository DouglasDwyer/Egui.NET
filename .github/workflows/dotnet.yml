name: .NET CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build:
    name: dotnet build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dsherret/rust-toolchain-file@v1

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # NoWarn suppresses pre-existing XML-doc diagnostics (missing/unresolved
      # cref targets, missing <param> tags, ambiguous overload refs, missing
      # doc comments) so that real compiler warnings still fail the build.
      - name: Build
        run: dotnet build Egui.NET.slnf /p:TreatWarningsAsErrors="true" "/p:NoWarn=CS1570%3BCS1572%3BCS1573%3BCS1574%3BCS0419%3BCS1711%3BCS1591"

  format:
    name: dotnet format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dsherret/rust-toolchain-file@v1

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # target/bindings is generated C# excluded because it's regenerated by
      # the Rust codegen tool and won't match .editorconfig style.
      - name: Format
        run: dotnet format Egui.NET.slnf --verify-no-changes --severity error --exclude target/bindings serde-generate
