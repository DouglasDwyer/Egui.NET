name: Pack

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dsherret/rust-toolchain-file@v1

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # Install from git rather than the last crates.io release, since the
      # release predates `workspace.metadata.cross` support in Cargo.toml.
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Pack
        run: dotnet pack Egui.NET.slnf -c Release --output nupkgs

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" nupkgs/*.nupkg --generate-notes
